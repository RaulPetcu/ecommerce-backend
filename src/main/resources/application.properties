spring.application.name=sb-ecom

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

project.image=images/

spring.app.jwtSecret=${JWT_SECRET_KEY}
spring.app.jwtExpirationMs=86400000
spring.ecom.app.jwtCookieName=springBootEcom
spring.ecom.app.jwtCookieSecure=${JWT_COOKIE_SECURE:true}
spring.ecom.app.jwtCookieSameSite=Lax

frontend.url=http://localhost:5173/

#server.port=5000

image.base.url=http://localhost:8080/images

stripe.secret.key=${STRIPE_KEY_SECRET}